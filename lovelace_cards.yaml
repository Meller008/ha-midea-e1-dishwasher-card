      name: "[[[\n        let sObj = states['sensor.YOUR_DEVICE_ID_status'];\n        let s = (sObj && sObj.state) ? String(sObj.state).toLowerCase() : '';\n        let opObj = states['sensor.YOUR_DEVICE_ID_operator'];\n        let isPaused = (opObj && opObj.state === 'pause');\n        if (s === 'running') {\n            return isPaused ? '⏸️ Мойка на паузе (отсрочка недоступна)' : '⏳ Мойка уже запущена (отсрочка недоступна)';\n        }\n        let dObj = states['binary_sensor.YOUR_DEVICE_ID_door'];\n        if (dObj && dObj.state === 'on') {\n            return '⚠️ Закройте дверцу перед запуском!';\n        }\n        let h = Math.round(Number(entity.state));\n        if (h > 0) {\n            let d = new Date();\n            d.setHours(d.getHours() + h);\n            let hh = String(d.getHours()).padStart(2, '0');\n            let mm = String(d.getMinutes()).padStart(2, '0');\n            return 'Запустить с отсрочкой на ' + h + ' ч (старт в ' + hh + ':' + mm + ')';\n        }\n\
        \        return 'Запустить с отсрочкой (выберите часы выше)';\n    ]]]"
      icon: "[[[\n        let sObj = states['sensor.YOUR_DEVICE_ID_status'];\n        let s = (sObj && sObj.state) ? String(sObj.state).toLowerCase() : '';\n        if (s === 'running') return 'mdi:timer-off-outline';\n        let dObj = states['binary_sensor.YOUR_DEVICE_ID_door'];\n        if (dObj && dObj.state === 'on') return 'mdi:door-open';\n        return 'mdi:timer-play-outline';\n    ]]]"
      styles:
        card:
          - padding: 12px
          - border-radius: 12px
          - background: "[[[\n                let sObj = states['sensor.YOUR_DEVICE_ID_status'];\n                let s = (sObj && sObj.state) ? String(sObj.state).toLowerCase() : '';\n                if (s === 'running') return 'rgba(255, 255, 255, 0.02)';\n                let dObj = states['binary_sensor.YOUR_DEVICE_ID_door'];\n                if (dObj && dObj.state === 'on') return 'rgba(255, 145, 0, 0.16)';\n                return (Number(entity.state) > 0) ? 'rgba(0, 229, 255, 0.16)' : 'rgba(255, 255, 255, 0.04)';\n            ]]]"
          - border: "[[[\n                let sObj = states['sensor.YOUR_DEVICE_ID_status'];\n                let s = (sObj && sObj.state) ? String(sObj.state).toLowerCase() : '';\n                if (s === 'running') return '1px solid rgba(255, 255, 255, 0.04)';\n                let dObj = states['binary_sensor.YOUR_DEVICE_ID_door'];\n                if (dObj && dObj.state === 'on') return '1px solid rgba(255, 145, 0, 0.4)';\n                return (Number(entity.state) > 0) ? '1px solid rgba(0, 229, 255, 0.4)' : '1px solid rgba(255, 255, 255, 0.08)';\n            ]]]"
          - transition: all 0.3s ease
          - cursor: "[[[\n                let sObj = states['sensor.YOUR_DEVICE_ID_status'];\n                let s = (sObj && sObj.state) ? String(sObj.state).toLowerCase() : '';\n                return (s === 'running') ? 'not-allowed' : 'pointer';\n            ]]]"
        name:
          - color: "[[[\n                let sObj = states['sensor.YOUR_DEVICE_ID_status'];\n                let s = (sObj && sObj.state) ? String(sObj.state).toLowerCase() : '';\n                if (s === 'running') return '#666666';\n                let dObj = states['binary_sensor.YOUR_DEVICE_ID_door'];\n                if (dObj && dObj.state === 'on') return '#FFAA00';\n                return (Number(entity.state) > 0) ? '#00E5FF' : '#8E8E93';\n            ]]]"
          - font-weight: '700'
          - font-size: 13px
        icon:
          - color: "[[[\n                let sObj = states['sensor.YOUR_DEVICE_ID_status'];\n                let s = (sObj && sObj.state) ? String(sObj.state).toLowerCase() : '';\n                if (s === 'running') return '#666666';\n                let dObj = states['binary_sensor.YOUR_DEVICE_ID_door'];\n                if (dObj && dObj.state === 'on') return '#FFAA00';\n                return (Number(entity.state) > 0) ? '#00E5FF' : '#8E8E93';\n            ]]]"
