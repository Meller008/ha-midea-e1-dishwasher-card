main_widget:
  type: custom:button-card
  entity: sensor.YOUR_DEVICE_ID_status
  name: Посудомойка
  icon: "[[[\n            let opObj = states['sensor.YOUR_DEVICE_ID_operator'];\n            if (opObj && opObj.state === 'pause') return 'mdi:pause-circle';\n            return 'mdi:dishwasher';\n        ]]]"
  show_state: false
  styles:
    card:
      - padding: 12px 14px
      - border-radius: 16px
      - background: rgba(255, 255, 255, 0.04)
      - border: 1px solid rgba(255, 255, 255, 0.08)
      - transition: all 0.3s ease
      - position: relative
      - overflow: hidden
      - isolation: isolate
      - z-index: '0'
      - --progress-bar-width: "[[[\n                    let sObj = states['sensor.YOUR_DEVICE_ID_status'];\n                    let s = (sObj && sObj.state) ? String(sObj.state).toLowerCase() : '';\n                    let opObj = states['sensor.YOUR_DEVICE_ID_operator'];\n                    let op = (opObj && opObj.state) ? String(opObj.state).toLowerCase() : '';\n\n                    // 1. Washing (running or paused): counts DOWN from 100% to 0%\n                    if (s === 'running' || op === 'pause') {\n                        let remObj = states['sensor.YOUR_DEVICE_ID_time_remaining'];\n                        let rem = (remObj && remObj.state) ? Number(remObj.state) : 0;\n                        let totObj = states['input_number.dishwasher_cycle_total_time'];\n                        let tot = (totObj && totObj.state) ? Number(totObj.state) : 0;\n                        if (!tot || tot <= 0) {\n                            let mObj = states['sensor.YOUR_DEVICE_ID_mode'];\n \
          \                           let m = (mObj && mObj.state) ? mObj.state : '';\n                            let modeMap = {'eco_wash':220, 'germ':178, 'auto_wash':150, 'glass_wash':120, 'hour_wash':90, 'fast_wash':30, 'quiet_night_wash':270};\n                            tot = modeMap[m] || (rem > 0 ? rem : 150);\n                        }\n                        if (rem > tot) tot = rem;\n                        let pct = (tot > 0) ? Math.min(100, Math.max(0, Math.round((rem / tot) * 100))) : 0;\n                        return pct + '%';\n                    }\n\n                    // 2. Delayed Start: counts UP from 0% to 100%\n                    if (s === 'order' || s === 'delay') {\n                        let dRemObj = states['sensor.YOUR_DEVICE_ID_delay_remaining'];\n                        let dRem = (dRemObj && dRemObj.state) ? Number(dRemObj.state) : 0;\n                        let dTotObj = states['input_number.dishwasher_delay_total_minutes'];\n                    \
          \    let dTot = (dTotObj && dTotObj.state) ? Number(dTotObj.state) : 0;\n                        if (dTot <= 0 || dRem > dTot) {\n                            dTot = dRem;\n                        }\n                        let elapsed = Math.max(0, dTot - dRem);\n                        let pct = (dTot > 0) ? Math.min(100, Math.max(0, Math.round((elapsed / dTot) * 100))) : 0;\n                        return pct + '%';\n                    }\n\n                    // 3. Complete: 100%\n                    if (s === 'complete') return '100%';\n\n                    return '0%';\n                ]]]"
      - --progress-bar-bg: "[[[\n                    let sObj = states['sensor.YOUR_DEVICE_ID_status'];\n                    let s = (sObj && sObj.state) ? String(sObj.state).toLowerCase() : '';\n                    let opObj = states['sensor.YOUR_DEVICE_ID_operator'];\n                    let op = (opObj && opObj.state) ? String(opObj.state).toLowerCase() : '';\n\n                    if (op === 'pause') return '#FFB300';\n                    if (s === 'running') return '#00E676';\n                    if (s === 'order' || s === 'delay') return '#00E5FF';\n                    if (s === 'complete') return '#00E676';\n                    return 'transparent';\n                ]]]"
      - --progress-bar-shadow: "[[[\n                    let sObj = states['sensor.YOUR_DEVICE_ID_status'];\n                    let s = (sObj && sObj.state) ? String(sObj.state).toLowerCase() : '';\n                    let opObj = states['sensor.YOUR_DEVICE_ID_operator'];\n                    let op = (opObj && opObj.state) ? String(opObj.state).toLowerCase() : '';\n\n                    if (op === 'pause') return '0 0 10px rgba(255, 179, 0, 0.7)';\n                    if (s === 'running') return '0 0 10px rgba(0, 230, 118, 0.7)';\n                    if (s === 'order' || s === 'delay') return '0 0 10px rgba(0, 229, 255, 0.7)';\n                    if (s === 'complete') return '0 0 12px rgba(0, 230, 118, 0.8)';\n                    return 'none';\n                ]]]"
    img_cell:
      - position: relative
      - overflow: hidden
      - border-radius: 50%
      - --water-top: "[[[\n                    let sObj = states['sensor.YOUR_DEVICE_ID_status'];\n                    let s = (sObj && sObj.state) ? String(sObj.state).toLowerCase() : '';\n                    let opObj = states['sensor.YOUR_DEVICE_ID_operator'];\n                    let op = (opObj && opObj.state) ? String(opObj.state).toLowerCase() : '';\n                    if (s === 'running' || op === 'pause') return '35%';\n                    if (s === 'complete') return '0%';\n                    return '100%';\n                ]]]"
      - --water-bg: "[[[\n                    let sObj = states['sensor.YOUR_DEVICE_ID_status'];\n                    let s = (sObj && sObj.state) ? String(sObj.state).toLowerCase() : '';\n                    let opObj = states['sensor.YOUR_DEVICE_ID_operator'];\n                    let op = (opObj && opObj.state) ? String(opObj.state).toLowerCase() : '';\n                    if (op === 'pause') return 'rgba(255, 179, 0, 0.45)';\n                    if (s === 'running') return 'rgba(0, 230, 118, 0.45)';\n                    if (s === 'complete') return 'rgba(0, 230, 118, 0.3)';\n                    return 'transparent';\n                ]]]"
      - --water-anim: "[[[\n                    let sObj = states['sensor.YOUR_DEVICE_ID_status'];\n                    let s = (sObj && sObj.state) ? String(sObj.state).toLowerCase() : '';\n                    let opObj = states['sensor.YOUR_DEVICE_ID_operator'];\n                    let op = (opObj && opObj.state) ? String(opObj.state).toLowerCase() : '';\n                    if (op === 'pause') return 'none';\n                    if (s === 'running') return 'wave 4s linear infinite';\n                    return 'none';\n                ]]]"
      - --icon-anim: "[[[\n                    let sObj = states['sensor.YOUR_DEVICE_ID_status'];\n                    let s = (sObj && sObj.state) ? String(sObj.state).toLowerCase() : '';\n                    let opObj = states['sensor.YOUR_DEVICE_ID_operator'];\n                    let op = (opObj && opObj.state) ? String(opObj.state).toLowerCase() : '';\n                    if (op === 'pause') return 'none';\n                    if (s === 'running') return 'shake 1.5s ease-in-out infinite';\n                    return 'none';\n                ]]]"
    grid:
      - grid-template-areas: '''i n warnings btn'' ''i info warnings btn'''
      - grid-template-columns: 40px 1fr auto auto
      - grid-template-rows: auto auto
      - column-gap: 12px
      - row-gap: 2px
      - align-items: center
    icon:
      - width: 26px
      - height: 26px
      - justify-self: center
      - align-self: center
      - padding: 8px
      - border-radius: 50%
      - background: "[[[\n                    let sObj = states['sensor.YOUR_DEVICE_ID_status'];\n                    let s = (sObj && sObj.state && sObj.state !== 'unavailable') ? String(sObj.state).toLowerCase() : 'power_off';\n                    let pwrObj = states['switch.YOUR_DEVICE_ID_power'];\n                    let isPowerOn = (pwrObj && pwrObj.state === 'on');\n                    let pObj = states['sensor.YOUR_DEVICE_ID_progress'];\n                    let p = (pObj && pObj.state && pObj.state !== 'unavailable') ? String(pObj.state).toLowerCase() : '';\n                    let opObj = states['sensor.YOUR_DEVICE_ID_operator'];\n                    let op = (opObj && opObj.state && opObj.state !== 'unavailable') ? String(opObj.state).toLowerCase() : '';\n\n                    if (op === 'pause') return 'rgba(255, 179, 0, 0.2)';\n                    if (s === 'running') {\n                        if (p.includes('wash') || p.includes('мойка')) return 'rgba(0, 230, 118, 0.15)';\n\
          \                        if (p.includes('rinse') || p.includes('полоск')) return 'rgba(255, 179, 0, 0.15)';\n                        if (p.includes('dry') || p.includes('сушк')) return 'rgba(255, 145, 0, 0.15)';\n                        return 'rgba(0, 230, 118, 0.15)';\n                    }\n                    if (s === 'order' || s === 'delay') return 'rgba(0, 229, 255, 0.15)';\n                    if (isPowerOn) return 'rgba(0, 229, 255, 0.15)';\n                    if (s === 'complete') return 'rgba(0, 230, 118, 0.15)';\n                    return 'rgba(255, 255, 255, 0.05)';\n                ]]]"
      - color: "[[[\n                    let sObj = states['sensor.YOUR_DEVICE_ID_status'];\n                    let s = (sObj && sObj.state && sObj.state !== 'unavailable') ? String(sObj.state).toLowerCase() : 'power_off';\n                    let pwrObj = states['switch.YOUR_DEVICE_ID_power'];\n                    let isPowerOn = (pwrObj && pwrObj.state === 'on');\n                    let pObj = states['sensor.YOUR_DEVICE_ID_progress'];\n                    let p = (pObj && pObj.state && pObj.state !== 'unavailable') ? String(pObj.state).toLowerCase() : '';\n                    let opObj = states['sensor.YOUR_DEVICE_ID_operator'];\n                    let op = (opObj && opObj.state && opObj.state !== 'unavailable') ? String(opObj.state).toLowerCase() : '';\n\n                    if (op === 'pause') return '#FFB300';\n                    if (s === 'running') {\n                        if (p.includes('wash') || p.includes('мойка')) return '#00E676';\n                        if (p.includes('rinse')\
          \ || p.includes('полоск')) return '#FFB300';\n                        if (p.includes('dry') || p.includes('сушк')) return '#FF9100';\n                        return '#00E676';\n                    }\n                    if (s === 'order' || s === 'delay') return '#00E5FF';\n                    if (isPowerOn) return '#00E5FF';\n                    if (s === 'complete') return '#00E676';\n                    if (s === 'error') return '#FF3D00';\n                    return '#888888';\n                ]]]"
    name:
      - font-size: 14px
      - font-weight: '600'
      - color: '#FFFFFF'
      - justify-self: start
    custom_fields:
      info:
        - font-size: 12px
        - justify-self: start
        - line-height: '1.3'
      warnings:
        - display: flex
        - gap: 6px
        - align-items: center
        - justify-self: end
      btn:
        - justify-self: end
        - padding-left: 4px
  custom_fields:
    info: "[[[\n                let sObj = states['sensor.YOUR_DEVICE_ID_status'];\n                let s = (sObj && sObj.state && sObj.state !== 'unavailable') ? String(sObj.state).toLowerCase() : 'power_off';\n                let pwrObj = states['switch.YOUR_DEVICE_ID_power'];\n                let isPowerOn = (pwrObj && pwrObj.state === 'on');\n                let pObj = states['sensor.YOUR_DEVICE_ID_progress'];\n                let p = (pObj && pObj.state && pObj.state !== 'unavailable') ? String(pObj.state).toLowerCase() : '';\n                let remObj = states['sensor.YOUR_DEVICE_ID_time_remaining'];\n                let rem = (remObj && remObj.state && remObj.state !== 'unavailable' && remObj.state !== 'neutral_gear') ? String(remObj.state) : '';\n                let tempObj = states['sensor.YOUR_DEVICE_ID_temperature'];\n                let temp = (tempObj && tempObj.state && tempObj.state !== 'unavailable') ? String(tempObj.state) : '';\n                let doorObj = states['binary_sensor.YOUR_DEVICE_ID_door'];\n\
      \                let door = (doorObj && doorObj.state) ? String(doorObj.state).toLowerCase() : 'off';\n                let opObj = states['sensor.YOUR_DEVICE_ID_operator'];\n                let op = (opObj && opObj.state && opObj.state !== 'unavailable') ? String(opObj.state).toLowerCase() : '';\n\n                if (op === 'pause') {\n                    let extra = '';\n                    if (rem && rem !== '0' && rem !== 'unknown') extra += ' • ' + rem + ' мин';\n                    if (temp && temp !== '0' && temp !== 'unknown') extra += ' • ' + temp + '°C';\n                    return \"<span style='color:#FFB300; font-weight:600;'>⏸️ Пауза (мойка приостановлена)</span>\" + extra;\n                }\n\n                if (s === 'running') {\n                    let stageHtml = '';\n                    if (p.includes('wash') || p.includes('мойка')) {\n                        stageHtml = \"<span style='color:#00E676; font-weight:600;'>\U0001F7E2 Мойка (можно докинуть)</span>\"\
      ;\n                    } else if (p.includes('rinse') || p.includes('полоск')) {\n                        stageHtml = \"<span style='color:#FFB300; font-weight:600;'>\U0001F7E1 Полоскание (порошок смыт)</span>\";\n                    } else if (p.includes('dry') || p.includes('сушк')) {\n                        stageHtml = \"<span style='color:#FF9100; font-weight:600;'>\U0001F7E0 Сушка (горячий пар)</span>\";\n                    } else {\n                        stageHtml = \"<span style='color:#00E676; font-weight:600;'>Идёт мойка</span>\";\n                    }\n                    let extra = '';\n                    if (rem && rem !== '0' && rem !== 'unknown') extra += ' • ' + rem + ' мин';\n                    if (temp && temp !== '0' && temp !== 'unknown') extra += ' • ' + temp + '°C';\n                    return stageHtml + extra;\n                }\n                if (s === 'order' || s === 'delay') {\n                    let dObj = states['sensor.YOUR_DEVICE_ID_delay_remaining'];\n\
      \                    let dRem = (dObj && dObj.state && dObj.state !== 'unavailable' && dObj.state !== '0') ? Number(dObj.state) : null;\n                    let delayHObj = states['input_number.dishwasher_delay_hours'];\n                    let delayHours = (delayHObj && delayHObj.state) ? Number(delayHObj.state) : 0;\n                    let delayText = '';\n                    if (dRem !== null && dRem > 0) {\n                        let dh = Math.floor(dRem / 60);\n                        let dm = dRem % 60;\n                        if (dh > 0 && dm > 0) delayText = dh + ' ч ' + dm + ' мин';\n                        else if (dh > 0) delayText = dh + ' ч';\n                        else delayText = dm + ' мин';\n                    } else if (delayHours > 0) {\n                        delayText = delayHours + ' ч';\n                    } else {\n                        delayText = '1 ч';\n                    }\n                    return \"<span style='color:#00E5FF; font-weight:600;'>⏳\
      \ Отложенный старт</span> • через \" + delayText;\n                }\n                if (door === 'on' && s !== 'running') {\n                    return \"<span style='color:#FFAA00;'>Дверца открыта • Загрузка</span>\";\n                }\n                if (s === 'complete') {\n                    return \"<span style='color:#00E676; font-weight:600;'>Чистая посуда • Можно разгружать</span>\";\n                }\n                if (isPowerOn) {\n                    return \"<span style='color:#00E5FF; font-weight:600;'>Простаивает</span>\";\n                }\n                return \"<span style='color:#8E8E93;'>Выключена</span>\";\n            ]]]"
    warnings: "[[[\n                let saltObj = states['binary_sensor.YOUR_DEVICE_ID_salt'];\n                let salt = (saltObj && saltObj.state) ? String(saltObj.state).toLowerCase() : 'off';\n                let rinseObj = states['binary_sensor.YOUR_DEVICE_ID_rinse_aid'];\n                let rinse = (rinseObj && rinseObj.state) ? String(rinseObj.state).toLowerCase() : 'off';\n                let warnHtml = '';\n                if (salt === 'on') {\n                    warnHtml += \"<div style='display:flex; align-items:center; background:rgba(255,61,0,0.18); border:1px solid rgba(255,61,0,0.4); border-radius:6px; padding:2px 6px;'><ha-icon icon='mdi:swap-horizontal-variant' style='color:#FF3D00; width:14px; height:14px; margin-right:3px;'></ha-icon><span style='color:#FF3D00; font-size:11px; font-weight:700;'>Соль</span></div>\";\n                }\n                if (rinse === 'on') {\n                    warnHtml += \"<div style='display:flex; align-items:center; background:rgba(255,61,0,0.18);\
      \ border:1px solid rgba(255,61,0,0.4); border-radius:6px; padding:2px 6px;'><ha-icon icon='mdi:vanish' style='color:#FF3D00; width:14px; height:14px; margin-right:3px;'></ha-icon><span style='color:#FF3D00; font-size:11px; font-weight:700;'>Ополаскиватель</span></div>\";\n                }\n                return warnHtml;\n            ]]]"
    btn: <ha-icon icon='mdi:tune' style='color:#8E8E93; width:20px; height:20px;'></ha-icon>
  extra_styles: "\n            ha-card::after {\n              content: '';\n              position: absolute;\n              bottom: 0;\n              left: 0;\n              height: 3px;\n              width: var(--progress-bar-width, 0%);\n              background: var(--progress-bar-bg, transparent);\n              box-shadow: var(--progress-bar-shadow, none);\n              transition: width 0.6s ease, background 0.4s ease;\n              border-bottom-left-radius: 16px;\n              border-bottom-right-radius: 16px;\n              z-index: 1;\n              pointer-events: none;\n            }\n            #img-cell {\n              position: relative !important;\n              overflow: hidden !important;\n              border-radius: 50% !important;\n            }\n            #img-cell::before {\n              content: '';\n              position: absolute;\n              left: -50%;\n              width: 200%;\n              height: 200%;\n              top: var(--water-top,\
    \ 100%);\n              background: var(--water-bg, transparent);\n              border-radius: 40%;\n              animation: var(--water-anim, none);\n              z-index: 1;\n              pointer-events: none;\n              transition: top 0.8s ease;\n            }\n            #icon {\n              position: relative;\n              z-index: 2;\n              animation: var(--icon-anim, none);\n            }\n            @keyframes wave {\n              from { transform: rotate(0deg); }\n              to   { transform: rotate(360deg); }\n            }\n            @keyframes shake {\n              0%, 100% { transform: rotate(0deg); }\n              25% { transform: rotate(3deg) translateY(-1px); }\n              75% { transform: rotate(-3deg) translateY(1px); }\n            }\n        "
  tap_action:
    action: navigate
    navigation_path: '#dishwasher'
popup_dialog:
  type: custom:bubble-card
  card_type: pop-up
  hash: '#dishwasher'
  name: Посудомойка Midea
  icon: mdi:dishwasher
  state_color: true
  show_header: true
  styles: "\n        .bubble-pop-up-container {\n            z-index: 9999 !important;\n        }\n    "
  cards:
    - type: custom:button-card
      entity: switch.YOUR_DEVICE_ID_power
      name: Питание посудомойки
      icon: mdi:power
      show_state: false
      show_label: true
      label: '[[[ return (entity.state === ''on'') ? ''Включена • Нажмите для выключения'' : ''Выключена • Нажмите для включения''; ]]]'
      styles:
        card:
          - padding: 12px 16px
          - border-radius: 16px
          - background: '[[[ return (entity.state === ''on'') ? ''linear-gradient(135deg, rgba(0, 230, 118, 0.16) 0%, rgba(0, 230, 118, 0.04) 100%)'' : ''rgba(255, 255, 255, 0.04)''; ]]]'
          - border: '[[[ return (entity.state === ''on'') ? ''1px solid rgba(0, 230, 118, 0.4)'' : ''1px solid rgba(255, 255, 255, 0.08)''; ]]]'
          - box-shadow: '[[[ return (entity.state === ''on'') ? ''0 0 16px rgba(0, 230, 118, 0.15)'' : ''none''; ]]]'
          - transition: all 0.3s ease
          - cursor: pointer
        grid:
          - grid-template-areas: '''i n'' ''i l'''
          - grid-template-columns: 44px 1fr
          - grid-template-rows: auto auto
          - align-items: center
          - column-gap: 14px
        icon:
          - width: 26px
          - height: 26px
          - padding: 9px
          - border-radius: 50%
          - background: '[[[ return (entity.state === ''on'') ? ''rgba(0, 230, 118, 0.22)'' : ''rgba(255, 82, 82, 0.12)''; ]]]'
          - color: '[[[ return (entity.state === ''on'') ? ''#00E676'' : ''#FF5252''; ]]]'
          - box-shadow: '[[[ return (entity.state === ''on'') ? ''0 0 10px rgba(0, 230, 118, 0.4)'' : ''none''; ]]]'
        name:
          - font-size: 15px
          - font-weight: '700'
          - color: '[[[ return (entity.state === ''on'') ? ''#00E676'' : ''#FFFFFF''; ]]]'
          - justify-self: start
        label:
          - font-size: 12px
          - color: '#8E8E93'
          - justify-self: start
          - margin-top: 2px
      tap_action:
        action: toggle
    - type: custom:button-card
      entity: sensor.YOUR_DEVICE_ID_status
      show_name: false
      show_state: false
      show_icon: false
      styles:
        card:
          - padding: 12px 14px
          - border-radius: 14px
          - background: rgba(255, 255, 255, 0.04)
          - border: 1px solid rgba(255, 255, 255, 0.08)
        grid:
          - grid-template-areas: '''content'''
          - grid-template-columns: 1fr
      custom_fields:
        content: "[[[\n            let sObj = states['sensor.YOUR_DEVICE_ID_status'];\n            let s = (sObj && sObj.state && sObj.state !== 'unavailable') ? String(sObj.state).toLowerCase() : 'power_off';\n            let opObj = states['sensor.YOUR_DEVICE_ID_operator'];\n            let op = (opObj && opObj.state && opObj.state !== 'unavailable') ? String(opObj.state).toLowerCase() : '';\n            let isRunning = (s === 'running');\n\n            let modeObj = states['sensor.YOUR_DEVICE_ID_mode'];\n            let rawMode = (modeObj && modeObj.state && modeObj.state !== 'unavailable') ? modeObj.state : '';\n            let modeMap = {\n                'eco_wash': 'Eco (Эко)',\n                'auto_wash': 'Auto (Авто)',\n                'germ': 'Интенсив',\n                'hour_wash': '90 минут',\n                'glass_wash': 'Стекло',\n                'fast_wash': 'Быстрая',\n                'neutral_gear': '—'\n            };\n            let mode = modeMap[rawMode] || (rawMode\
          \ === 'neutral_gear' ? '—' : (rawMode || '—'));\n            if (op === 'pause' && isRunning) {\n                mode += \" <span style='color:#FFB300; font-size:11px;'>(Пауза)</span>\";\n            }\n\n            let remObj = states['sensor.YOUR_DEVICE_ID_time_remaining'];\n            let remVal = (remObj && remObj.state && remObj.state !== 'unavailable' && remObj.state !== 'neutral_gear') ? remObj.state : '';\n            let rem = (isRunning && remVal && remVal !== '0') ? (remVal + ' мин' + (op === 'pause' ? ' ⏸️' : '')) : '—';\n\n            let tempObj = states['sensor.YOUR_DEVICE_ID_temperature'];\n            let tempVal = (tempObj && tempObj.state && tempObj.state !== 'unavailable') ? tempObj.state : '';\n            let temp = (isRunning && tempVal && tempVal !== '0') ? (tempVal + '°C') : '—';\n\n            let doorObj = states['binary_sensor.YOUR_DEVICE_ID_door'];\n            let door = (doorObj && doorObj.state) ? doorObj.state : 'off';\n            let doorText\
          \ = (door === 'on') ? \"<span style='color:#FFAA00; font-weight:600;'>Открыта</span>\" : \"<span style='color:#00E676; font-weight:600;'>Закрыта</span>\";\n\n            let saltObj = states['binary_sensor.YOUR_DEVICE_ID_salt'];\n            let salt = (saltObj && saltObj.state) ? String(saltObj.state).toLowerCase() : 'off';\n            let saltHtml = (salt === 'on')\n                ? \"<div style='display:flex; align-items:center; gap:6px; color:#FF3D00; font-weight:700;'><ha-icon icon='mdi:swap-horizontal-variant' style='color:#FF3D00; width:16px; height:16px;'></ha-icon><span>Требуется соль</span></div>\"\n                : \"<div style='display:flex; align-items:center; gap:6px; color:#00E676;'><ha-icon icon='mdi:check-circle-outline' style='color:#00E676; width:16px; height:16px;'></ha-icon><span>Соль: в норме</span></div>\";\n\n            let rinseObj = states['binary_sensor.YOUR_DEVICE_ID_rinse_aid'];\n            let rinse = (rinseObj && rinseObj.state) ? String(rinseObj.state).toLowerCase()\
          \ : 'off';\n            let rinseHtml = (rinse === 'on')\n                ? \"<div style='display:flex; align-items:center; gap:6px; color:#FF3D00; font-weight:700;'><ha-icon icon='mdi:vanish' style='color:#FF3D00; width:16px; height:16px;'></ha-icon><span>Ополаскиватель!</span></div>\"\n                : \"<div style='display:flex; align-items:center; gap:6px; color:#00E676;'><ha-icon icon='mdi:check-circle-outline' style='color:#00E676; width:16px; height:16px;'></ha-icon><span>Ополаскиватель: в норме</span></div>\";\n\n            return \"<div style='display:grid; grid-template-columns: 1fr 1fr; gap:14px; font-size:13px; align-items:center; text-align:left;'>\" +\n                   \"<div style='display:flex; flex-direction:column; gap:8px; border-right:1px solid rgba(255,255,255,0.08); padding-right:10px; text-align:left; align-items:flex-start;'>\" +\n                     \"<div style='font-size:11px; text-transform:uppercase; color:#8E8E93; font-weight:700; letter-spacing:0.5px;\
          \ text-align:left;'>Расходники</div>\" +\n                     saltHtml +\n                     rinseHtml +\n                   \"</div>\" +\n                   \"<div style='display:grid; grid-template-columns: 1fr 1fr; gap:8px; text-align:left;'>\" +\n                     \"<div><span style='color:#8E8E93;'>Режим:</span> <b>\" + mode + \"</b></div>\" +\n                     \"<div><span style='color:#8E8E93;'>Осталось:</span> <b>\" + rem + \"</b></div>\" +\n                     \"<div><span style='color:#8E8E93;'>Темп:</span> <b>\" + temp + \"</b></div>\" +\n                     \"<div><span style='color:#8E8E93;'>Дверца:</span> <b>\" + doorText + \"</b></div>\" +\n                   \"</div>\" +\n                   \"</div>\";\n        ]]]"
    - type: custom:button-card
